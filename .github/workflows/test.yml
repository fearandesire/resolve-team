name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '9.1.0'
          
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        
      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm run build

      - name: Run tests
        run: pnpm test
